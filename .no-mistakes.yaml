# Per-repository no-mistakes configuration.
#
# Validation runs this project's own checks instead of improvising a throwaway
# database and browser harness on every run. Each entry below names a package
# script the repository already defines; `.github/workflows/ci.yml` (`npm run
# check`) stays the full CI-parity owner.
#
# Every command resolves the Node toolchain from `.nvmrc` at run time, the way CI
# provides it, because the gate host's own `node`/`npm` do not satisfy the pin.
# `.nvmrc` stays the one place the version is written, and a toolchain that is
# not installed fails the command instead of silently falling back to that host.
#
# no-mistakes reads `commands.*` and `test.instructions` only from the
# default-branch copy of this file, so these pins take effect once this file is
# on `main`.

commands:
  # A run worktree starts with tracked files only, so the ignored dependency tree
  # the pinned commands need is materialized the way CI does it: `packageManager`
  # names the npm to install first, because the npm bundled with the `.nvmrc`
  # Node is older and `.npmrc` sets `engine-strict=true`. CI also sets `HUSKY=0`
  # so `npm ci` does not run the root `prepare` script and install git hooks.
  prepare: 'N="$(cat .nvmrc)"; B="${NVM_DIR:-$HOME/.nvm}/versions/node/v$N/bin"; { [ -x "$B/node" ] && [ -x "$B/npm" ]; } || { echo "no Node $N from .nvmrc at $B" >&2; exit 1; }; export PATH="$B:$PATH"; S=$(node -p "require(\"./package.json\").packageManager"); HUSKY=0 npx --yes "$S" ci --prefer-offline'
  # `test:unit` (node --test) plus `test:schema` (embedded migration assertions).
  test: 'N="$(cat .nvmrc)"; B="${NVM_DIR:-$HOME/.nvm}/versions/node/v$N/bin"; { [ -x "$B/node" ] && [ -x "$B/npm" ]; } || { echo "no Node $N from .nvmrc at $B" >&2; exit 1; }; export PATH="$B:$PATH"; npm test'
  lint: 'N="$(cat .nvmrc)"; B="${NVM_DIR:-$HOME/.nvm}/versions/node/v$N/bin"; { [ -x "$B/node" ] && [ -x "$B/npm" ]; } || { echo "no Node $N from .nvmrc at $B" >&2; exit 1; }; export PATH="$B:$PATH"; npm run lint && npm run typecheck'
  format: 'N="$(cat .nvmrc)"; B="${NVM_DIR:-$HOME/.nvm}/versions/node/v$N/bin"; { [ -x "$B/node" ] && [ -x "$B/npm" ]; } || { echo "no Node $N from .nvmrc at $B" >&2; exit 1; }; export PATH="$B:$PATH"; npm run format:check'

test:
  instructions: |
    Use the pinned `npm test` command and the suites this repository already
    ships: the `test:unit` files colocated with their features, and the
    `test:schema` assertions that read the migration SQL through
    `scripts/validate-schema.mjs`. Add a case to those suites when a change needs
    one.
    When a change genuinely needs end-user verification, use the repository's own
    live paths: `npm run test:acceptance`, the staging gates in
    `docs/testing.md`, and `chrome-devtools-axi` to drive the running app. Those
    paths need the private acceptance environment, whose prerequisites and setup
    `docs/testing.md` owns and a run worktree normally does not have; when it is
    unavailable, record in the evidence what was not exercised.
    In place of those paths, do not write a database shim, a browser driver, or
    any other improvised harness, and do not install anything to build one.
