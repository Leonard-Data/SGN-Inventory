# Per-repository no-mistakes configuration: the project's own commands, instead
# of an improvised harness. `test`, `lint` and `format` name a package script and
# `prepare` materializes the dependency tree they need; `.github/workflows/ci.yml`
# (`npm run check`) stays the full CI-parity owner, and `docs/development.md` and
# `docs/testing.md` own how the suites and the private acceptance environment
# work. These take effect once this file is on the default branch.

commands:
  # A run worktree has tracked files only, so this materializes the dependency tree.
  prepare: 'N=$(cat .nvmrc); B="${NVM_DIR:-$HOME/.nvm}/versions/node/v$N/bin"; [ -x "$B/node" ] || { echo "no Node $N from .nvmrc at $B" >&2; exit 1; }; export PATH="$B:$PATH"; S=$(node -p "require(\"./package.json\").packageManager"); HUSKY=0 npx --yes "$S" ci --prefer-offline'
  # The unit and schema suites.
  test: 'N=$(cat .nvmrc); B="${NVM_DIR:-$HOME/.nvm}/versions/node/v$N/bin"; [ -x "$B/node" ] || { echo "no Node $N from .nvmrc at $B" >&2; exit 1; }; export PATH="$B:$PATH"; npm test'
  # ESLint plus the type check the pipeline has no other slot for.
  lint: 'N=$(cat .nvmrc); B="${NVM_DIR:-$HOME/.nvm}/versions/node/v$N/bin"; [ -x "$B/node" ] || { echo "no Node $N from .nvmrc at $B" >&2; exit 1; }; export PATH="$B:$PATH"; npm run lint && npm run typecheck'
  # Formatting drift, caught before the push step commits.
  format: 'N=$(cat .nvmrc); B="${NVM_DIR:-$HOME/.nvm}/versions/node/v$N/bin"; [ -x "$B/node" ] || { echo "no Node $N from .nvmrc at $B" >&2; exit 1; }; export PATH="$B:$PATH"; npm run format:check'

test:
  instructions: |
    Run the pinned `npm test` command, and add a case to the suites it covers
    when a change needs one.
    `npm run test:acceptance` is the only live end-user path; `docs/testing.md`
    and `docs/development.md` own how it works.
    Do not write a new database shim, a browser driver, or any other improvised
    harness, and do not install anything to build one.
