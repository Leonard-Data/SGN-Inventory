name: Review database migrations
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Isolated stage (select matching develop/main branch)'
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      apply:
        description: >-
          Apply reviewed pending migrations; false lists them and fails while
          any remain pending
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  migrate:
    needs: quality
    uses: ./.github/workflows/migration.yml
    with:
      stage: ${{ inputs.stage }}
      apply: ${{ inputs.apply }}
    secrets: inherit
