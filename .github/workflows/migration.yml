name: Apply stage migrations
# The guard-and-push sequence exists only here; both the release pipeline and the
# database-only workflow call it, so the release-critical path cannot drift.
on:
  workflow_call:
    inputs:
      stage:
        description: 'Isolated stage (dev on develop, prod on main)'
        required: true
        type: string
      apply:
        description: >-
          true applies the stage's reviewed pending migrations; false never
          writes and fails when any migration is still pending
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  migrate:
    if: (inputs.stage == 'dev' && github.ref == 'refs/heads/develop') || (inputs.stage == 'prod' && github.ref == 'refs/heads/main')
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
      SGN_ENV: ${{ inputs.stage }}
      DEV_SUPABASE_PROJECT_REF: ${{ vars.DEV_SUPABASE_PROJECT_REF }}
      PROD_SUPABASE_PROJECT_REF: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.13.0
      - run: npm ci
      - name: Verify database target before cloud contact
        run: node scripts/release-guard.mjs target
      - name: Inspect pinned CLI migration interface
        run: |
          npx --no-install supabase link --help
          npx --no-install supabase db push --help
      - run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: List pending migrations without applying
        run: |
          npx --no-install supabase db push --linked --dry-run --skip-vault --output-format json > "$RUNNER_TEMP/pending.json"
          cat "$RUNNER_TEMP/pending.json"
      - name: Apply the reviewed pending migrations
        if: inputs.apply
        run: npx --no-install supabase db push --linked --skip-vault --yes
      - name: Fail while migrations remain pending
        if: ${{ !inputs.apply }}
        run: node scripts/release-guard.mjs pending "$RUNNER_TEMP/pending.json"
