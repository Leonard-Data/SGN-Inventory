name: Release application and database
on:
  push:
    branches: [main] # Repository default branch; update guards if it is renamed.
  workflow_dispatch:
    inputs:
      stage:
        description: 'Isolated stage (select matching develop/main branch)'
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      migration:
        description: >-
          apply = apply the reviewed pending migrations before this release
          (default); verify = never write, and fail while migrations are pending
        required: true
        default: apply
        type: choice
        options: [apply, verify]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.stage || 'prod' }}
  cancel-in-progress: false

jobs:
  quality:
    # One activation switch per stage: CD_DEV_ENABLED alone can never start a
    # production run and CD_PROD_ENABLED alone can never start a development
    # release. Activate each stage only after projects, credentials and
    # protection gates are configured; CD_PROD_ENABLED is deliberately left
    # unset until staging acceptance and a separate production release decision.
    if: >-
      (inputs.stage == 'dev' && vars.CD_DEV_ENABLED == 'true') ||
      ((inputs.stage == 'prod' || github.event_name == 'push') && vars.CD_PROD_ENABLED == 'true')
    uses: ./.github/workflows/ci.yml
  # Database changes land before the application that depends on them. The
  # guard-and-push sequence is defined once in migration.yml; a failed migration
  # fails the run and the deploy job below is skipped, never continued. The
  # stage environment gate therefore covers the migrations and the upload together.
  migrate:
    needs: quality
    uses: ./.github/workflows/migration.yml
    with:
      stage: ${{ inputs.stage || 'prod' }}
      # A merge authorizes application delivery, not new database writes.
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.migration == 'apply' }}
    secrets: inherit
  deploy:
    needs: migrate
    # Stage branch, stage switch and host project must all agree; the stage
    # switch is repeated here so a mistyped trigger guard cannot publish.
    if: >-
      (inputs.stage == 'dev' && github.ref == 'refs/heads/develop' && vars.CD_DEV_ENABLED == 'true') ||
      ((inputs.stage == 'prod' || github.event_name == 'push') && github.ref == 'refs/heads/main' && vars.CD_PROD_ENABLED == 'true')
    environment:
      name: ${{ inputs.stage || 'prod' }}
      url: ${{ steps.publish.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      SGN_ENV: ${{ inputs.stage || 'prod' }}
      # The activation guard reads the selected stage's switch from the process
      # environment, so this shared job exports both stage switches it gates on.
      CD_DEV_ENABLED: ${{ vars.CD_DEV_ENABLED }}
      CD_PROD_ENABLED: ${{ vars.CD_PROD_ENABLED }}
      DEV_SUPABASE_PROJECT_REF: ${{ vars.DEV_SUPABASE_PROJECT_REF }}
      PROD_SUPABASE_PROJECT_REF: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
      DEV_VERCEL_PROJECT_ID: ${{ vars.DEV_VERCEL_PROJECT_ID }}
      PROD_VERCEL_PROJECT_ID: ${{ vars.PROD_VERCEL_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.13.0
      - run: npm ci
      - name: Verify stage activation before cloud contact
        env:
          SGN_CD_KIND: ${{ inputs.stage || 'prod' }}
        run: node scripts/release-guard.mjs activation
      - name: Verify isolated release configuration before cloud contact
        run: node scripts/release-guard.mjs configuration
      # Both targets use their isolated project's Production environment.
      - run: npx --no-install vercel pull --yes --environment=production
      - name: Verify downloaded project and variables before building
        run: node scripts/release-guard.mjs pulled
      - run: npx --no-install vercel build --prod
      - name: Deploy exact stage build
        id: publish
        shell: bash
        run: |
          url=$(npx --no-install vercel deploy --prebuilt --prod --yes)
          printf 'DEPLOYMENT_URL=%s\n' "$url" >> "$GITHUB_ENV"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '### Application deployment\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed stage health
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/release-guard.mjs smoke
